name: ADS MCP V1 tests
on:
  push:
    paths:
      - "Projects/ADS-MCP-Automation-V1.0/**"
      - ".github/workflows/ads-mcp-v1.yml"
  pull_request:
    paths:
      - "Projects/ADS-MCP-Automation-V1.0/**"
      - ".github/workflows/ads-mcp-v1.yml"
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Projects/ADS-MCP-Automation-V1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
