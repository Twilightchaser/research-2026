[project]
name = "ads-mcp-server"
version = "0.1.0"
description = "MCP server for Keysight Advanced Design System (ADS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]
keywords = ["ads", "keysight", "mcp", "eda", "rf", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
ads-mcp-server = "ads_mcp_server.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ads_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
